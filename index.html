<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Matches standard PDF viewer dark grey */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pdf-wrapper {
            width: 1400px; /* Forces the browser PDF engine to maintain two-page view */
            height: 900px;
            /* You can scale it down if the viewport is smaller using CSS zoom or transform */
            max-width: 100%;
            max-height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="pdf-wrapper">
        <iframe src="PF_FI_021026.pdf#zoom=page-fit"></iframe>
    </div>
</body>
</html>
